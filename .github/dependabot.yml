version: 2

updates:
  # ── Back-end ────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/pfe-rh-serverless"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Tunis"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(api)"
    # Regroupe le menu fretin en une seule demande : sans cela,
    # quinze pull requests par semaine finissent ignorées.
    groups:
      mineures-et-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Front ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Tunis"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(front)"
    groups:
      mineures-et-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Infrastructure ──────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Tunis"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(infra)"

  # ── Les actions du workflow elles-mêmes ─────────────────────────
  # Une action épinglée sur une version obsolète est une dépendance
  # comme une autre, et personne ne pense à la mettre à jour.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
