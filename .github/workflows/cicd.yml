name: CI/CD

# Chaine complete d'integration et de livraison continues.
#
#   ETAPE 1 - INTEGRATION      qualite, tests, securite, analyse
#   ETAPE 2 - REVUE            differentiel d'infrastructure (pull requests)
#   ETAPE 3 - LIVRAISON        deploiement des piles CDK
#   ETAPE 4 - VALIDATION       tests de fumee sur l'API deployee
#   ETAPE 5 - PUBLICATION      construction et mise en ligne du front
#   ETAPE 6 - RECETTE          verification de bout en bout
#
# CodeQL et SonarCloud s'executent en parallele du deploiement : ils
# durent plusieurs minutes et leur resultat n'est pas bloquant pour une
# livraison. Ils apparaissent neanmoins dans le meme graphe.
#
# Fichier ecrit sans accents : PowerShell corrompt les caracteres
# accentues lors des editions par script.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Analyse hebdomadaire : detecte les failles publiees apres le
    # dernier commit, sur du code qui n'a pourtant pas change.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  ETAPE: dev
  NODE_VERSION: '22'

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ================================================================
  # ETAPE 1 - INTEGRATION
  # ================================================================

  qualite:
    name: 1a - Qualite du code
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Dependances
        run: |
          cd pfe-rh-serverless && npm ci && cd ..
          cd frontend && npm ci && cd ..
          cd infra && npm ci

      # Attrape en deux secondes les erreurs d'import qui feraient
      # echouer toutes les routes apres un deploiement de trois minutes.
      - name: Chargement de l'application
        working-directory: pfe-rh-serverless
        run: node -e "require('./server.js'); console.log('Chargement reussi')"

      - name: Typage du front
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Typage de l'infrastructure
        working-directory: infra
        run: npx tsc --noEmit

      # Le linting signale notamment les hooks React mal places, une
      # erreur qui ne se manifeste autrement qu'a l'execution.
      - name: Style du front
        working-directory: frontend
        run: npx eslint . --max-warnings 0
        continue-on-error: true

  tests:
    name: 1b - Tests unitaires
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pfe-rh-serverless/package-lock.json

      - name: Dependances
        working-directory: pfe-rh-serverless
        run: npm ci

      # Le moteur de paie applique un bareme legal : une regression y
      # produirait des bulletins faux sans lever la moindre erreur.
      - name: Moteur de paie
        working-directory: pfe-rh-serverless
        run: npx jest src/utils/__tests__ --verbose

      - name: Rapport de couverture
        working-directory: pfe-rh-serverless
        run: |
          npx jest src/utils/__tests__ --coverage --coverageReporters=text-summary \
            | tee /tmp/couverture.txt
          {
            echo "### Couverture du moteur de paie"
            echo '```'
            cat /tmp/couverture.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  securite:
    name: 1c - Securite des dependances
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Signale les dependances portant une vulnerabilite connue.
      # En avertissement : une faille dans un outil de developpement ne
      # doit pas bloquer une livraison, mais doit rester visible.
      - name: Vulnerabilites du back
        working-directory: pfe-rh-serverless
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Vulnerabilites du front
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      # Bloquant : une cle publiee reste dans l'historique Git meme
      # apres suppression du fichier.
      #
      # Le motif exige une valeur affectee, pas la simple mention du
      # nom : process.env.AWS_SECRET_ACCESS_KEY est legitime. Le
      # dossier .github est exclu, sinon le motif se detecte lui-meme.
      - name: Recherche de secrets
        run: |
          MOTIFS='AKIA[0-9A-Z]{16}|aws_secret_access_key["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9/+=]{20,}|-----BEGIN (RSA|OPENSSH) PRIVATE KEY-----'
          if grep -rEn "$MOTIFS" \
               --include='*.ts' --include='*.js' --include='*.tsx' \
               --include='*.json' --include='*.yml' \
               --exclude-dir=node_modules --exclude-dir=.git \
               --exclude-dir=dist --exclude-dir=cdk.out --exclude-dir=.github . ; then
            echo "::error::Secret potentiel detecte dans le code source"
            exit 1
          fi
          echo "Aucun secret detecte"

  codeql:
    name: 1d - Analyse CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Initialisation
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-and-quality elargit l'analyse au-dela des seules
          # failles : code mort, comparaisons impossibles, promesses
          # non attendues.
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  sonarcloud:
    name: 1e - Analyse SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # SonarCloud a besoin de l'historique complet pour attribuer
          # chaque ligne a son auteur et calculer le code neuf.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dependances
        working-directory: pfe-rh-serverless
        run: npm ci

      # La couverture est produite ici puis transmise a SonarCloud :
      # sans elle, l'outil ne distingue pas le code teste du reste.
      - name: Tests et couverture
        working-directory: pfe-rh-serverless
        run: npx jest src/utils/__tests__ --coverage --coverageReporters=lcov

      - name: Analyse
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ================================================================
  # ETAPE 2 - REVUE (pull requests uniquement)
  # ================================================================

  apercu:
    name: 2 - Differentiel d'infrastructure
    needs: [qualite, tests, securite]
    # Les pull requests de Dependabot n'ont pas acces aux secrets :
    # protection de GitHub contre l'exfiltration. Le differentiel n'a
    # de toute facon aucun sens pour une montee de version.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dependances
        run: |
          cd pfe-rh-serverless && npm ci --omit=dev && cd ..
          cd infra && npm ci

      # Affiche ce que le deploiement modifierait, sans rien appliquer :
      # la revue de code etendue a l'infrastructure.
      - name: Differentiel
        working-directory: infra
        run: npx cdk diff --all -c etape=${{ env.ETAPE }}

  # ================================================================
  # ETAPE 3 - LIVRAISON
  # ================================================================

  infrastructure:
    name: 3 - Deploiement de l'infrastructure
    needs: [qualite, tests, securite]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      url_api: ${{ steps.sorties.outputs.url_api }}
      compartiment: ${{ steps.sorties.outputs.compartiment }}
      distribution: ${{ steps.sorties.outputs.distribution }}
      url_application: ${{ steps.sorties.outputs.url_application }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --omit=dev : seules les dependances de production entrent dans
      # le paquet Lambda, plafonne a 250 Mo decompresses.
      - name: Dependances de production
        working-directory: pfe-rh-serverless
        run: npm ci --omit=dev

      - name: Dependances de l'infrastructure
        working-directory: infra
        run: npm ci

      - name: Deploiement des six piles
        working-directory: infra
        run: npx cdk deploy --all -c etape=${{ env.ETAPE }} --require-approval never

      # Les valeurs sont lues depuis CloudFormation plutot que codees
      # dans le depot : elles restent justes si une pile est recreee.
      - name: Lecture des sorties
        id: sorties
        run: |
          lire() {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text
          }
          echo "url_api=$(lire PfeRh-${{ env.ETAPE }}-Api UrlApi)" >> $GITHUB_OUTPUT
          echo "compartiment=$(lire PfeRh-${{ env.ETAPE }}-Front NomCompartimentFront)" >> $GITHUB_OUTPUT
          echo "distribution=$(lire PfeRh-${{ env.ETAPE }}-Front IdDistribution)" >> $GITHUB_OUTPUT
          echo "url_application=$(lire PfeRh-${{ env.ETAPE }}-Front UrlApplication)" >> $GITHUB_OUTPUT

  # ================================================================
  # ETAPE 4 - VALIDATION
  # ================================================================

  fumee:
    name: 4 - Tests de fumee
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      # Une fonction qui ne demarre plus renvoie 500 sur toutes les
      # routes. Sans ce controle, l'echec ne se decouvre qu'a l'usage.
      - name: Route publique accessible
        run: |
          URL="${{ needs.infrastructure.outputs.url_api }}/offres"
          CODE=$(curl -s -o /tmp/reponse -w "%{http_code}" "$URL")
          echo "GET /offres -> $CODE"
          head -c 300 /tmp/reponse
          if [ "$CODE" != "200" ]; then
            echo "::error::L'API ne repond pas correctement ($CODE)"
            exit 1
          fi

      # Une route protegee doit etre rejetee par la passerelle avant
      # meme d'invoquer la fonction : c'est un test de securite, pas
      # seulement un test fonctionnel.
      - name: Route protegee refusee sans jeton
        run: |
          URL="${{ needs.infrastructure.outputs.url_api }}/employes"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "GET /employes sans jeton -> $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::L'autorisation ne protege pas la route ($CODE)"
            exit 1
          fi

  # ================================================================
  # ETAPE 5 - PUBLICATION
  # ================================================================

  application:
    name: 5 - Publication de l'application web
    needs: [infrastructure, fumee]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dependances
        working-directory: frontend
        run: npm ci

      # L'URL de l'API vient du deploiement qui precede : le front
      # pointe toujours vers l'infrastructure reellement en place.
      - name: Configuration du build
        working-directory: frontend
        run: |
          cat > .env.production <<EOF
          VITE_API_URL=${{ needs.infrastructure.outputs.url_api }}
          VITE_COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          VITE_AWS_REGION=${{ env.AWS_REGION }}
          EOF

      - name: Construction
        working-directory: frontend
        run: npm run build

      # Les fichiers portent une empreinte dans leur nom : leur contenu
      # ne change jamais, ils sont mis en cache un an.
      - name: Publication des ressources statiques
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ needs.infrastructure.outputs.compartiment }} \
            --delete --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      # index.html garde le meme nom d'une version a l'autre : jamais de
      # cache, sinon les navigateurs chargeraient l'ancienne application.
      - name: Publication de index.html
        working-directory: frontend
        run: |
          aws s3 cp dist/index.html s3://${{ needs.infrastructure.outputs.compartiment }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Purge du cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.infrastructure.outputs.distribution }} \
            --paths "/*"

  # ================================================================
  # ETAPE 6 - RECETTE
  # ================================================================

  recette:
    name: 6 - Verification de bout en bout
    needs: [infrastructure, application]
    runs-on: ubuntu-latest
    steps:
      - name: Application servie par CloudFront
        run: |
          # La propagation de l'invalidation prend quelques secondes
          sleep 20
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ needs.infrastructure.outputs.url_application }}")
          echo "GET application -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::CloudFront ne sert pas l'application ($CODE)"
            exit 1
          fi

      - name: Recapitulatif
        run: |
          {
            echo "## Livraison reussie"
            echo ""
            echo "| Element | Valeur |"
            echo "|---|---|"
            echo "| Environnement | \`${{ env.ETAPE }}\` |"
            echo "| Region | \`${{ env.AWS_REGION }}\` |"
            echo "| API | ${{ needs.infrastructure.outputs.url_api }} |"
            echo "| Application | ${{ needs.infrastructure.outputs.url_application }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Six piles CDK deployees : Data, Auth, Api, Front, Cicd, Supervision."
          } >> $GITHUB_STEP_SUMMARY