name: Analyse du code

# Analyse statique approfondie, separee du pipeline de deploiement :
# elle est plus lente et ne doit pas retarder une livraison.
#
#   CodeQL      - vulnerabilites reelles : injections, donnees non
#                 validees, chemins d'execution dangereux
#   SonarCloud  - duplication, complexite, points chauds de securite,
#                 suivi de la couverture de tests dans le temps
#
# Les deux sont gratuits sur depot public.
#
# Fichier ecrit sans accents : PowerShell corrompt les caracteres
# accentues lors des editions par script.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Une analyse hebdomadaire detecte les failles publiees apres le
    # dernier commit, sur du code qui n'a pourtant pas change.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Initialisation
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-and-quality elargit l'analyse au-dela des seules
          # failles : code mort, comparaisons impossibles, promesses
          # non attendues.
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # SonarCloud a besoin de l'historique complet pour attribuer
          # chaque ligne a son auteur et calculer le code neuf.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Dependances
        working-directory: pfe-rh-serverless
        run: npm ci

      # La couverture est produite ici puis transmise a SonarCloud :
      # sans elle, l'outil ne peut pas distinguer le code teste du reste.
      - name: Tests et couverture
        working-directory: pfe-rh-serverless
        run: npx jest src/utils/__tests__ --coverage --coverageReporters=lcov --coverageReporters=text-summary

      - name: Analyse
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}