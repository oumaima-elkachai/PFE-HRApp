name: Deploiement

# Etapes du pipeline :
#
#   qualite    -> typage et style, sur les trois dossiers
#   tests      -> tests unitaires du moteur de paie
#   securite   -> vulnerabilites des dependances, fuites de secrets
#   apercu     -> cdk diff, uniquement sur les pull requests
#   infra      -> deploiement des cinq piles CDK
#   fumee      -> l'API repond-elle reellement apres deploiement
#   front      -> construction et publication de l'application web
#   final      -> l'application est-elle servie par CloudFront
#
# Les etapes s'enchainent : un echec en amont empeche tout deploiement.
#
# Ce fichier est volontairement ecrit sans accents : PowerShell corrompt
# les caracteres accentues lors des editions par script.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  ETAPE: dev
  NODE_VERSION: '22'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Integration ------------------------------------------------

  qualite:
    name: Qualite du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Dependances
        run: |
          cd pfe-rh-serverless && npm ci && cd ..
          cd frontend && npm ci && cd ..
          cd infra && npm ci

      # Attrape en deux secondes les erreurs d'import qui feraient
      # echouer toutes les routes apres un deploiement de trois minutes.
      - name: Chargement de l'application
        working-directory: pfe-rh-serverless
        run: node -e "require('./server.js'); console.log('Chargement reussi')"

      - name: Typage du front
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Typage de l'infrastructure
        working-directory: infra
        run: npx tsc --noEmit

      # Le linting signale notamment les hooks React mal places, une
      # erreur qui ne se manifeste autrement qu'a l'execution.
      - name: Style du front
        working-directory: frontend
        run: npx eslint . --max-warnings 0
        continue-on-error: true

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pfe-rh-serverless/package-lock.json

      - name: Dependances
        working-directory: pfe-rh-serverless
        run: npm ci

      # Le moteur de paie applique un bareme legal : une regression y
      # produirait des bulletins faux sans lever la moindre erreur.
      - name: Moteur de paie
        working-directory: pfe-rh-serverless
        run: npx jest src/utils/__tests__ --verbose

      - name: Couverture
        working-directory: pfe-rh-serverless
        run: npx jest src/utils/__tests__ --coverage --coverageReporters=text-summary
        continue-on-error: true

  securite:
    name: Analyse de securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Signale les dependances portant une vulnerabilite connue.
      # En avertissement : une faille dans un outil de developpement ne
      # doit pas bloquer une livraison, mais doit rester visible.
      - name: Vulnerabilites du back
        working-directory: pfe-rh-serverless
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Vulnerabilites du front
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      # Recherche de secrets committes par inadvertance. Bloquant :
      # une cle publiee reste dans l'historique Git meme apres suppression.
      #
      # Le motif exige une valeur affectee, pas la simple mention du nom :
      # process.env.AWS_SECRET_ACCESS_KEY est legitime, une chaine de
      # vingt caracteres ou plus apres le signe egal ne l'est pas.
      #
      # .github est exclu, sinon ce motif se detecterait lui-meme.
      - name: Recherche de secrets
        run: |
          MOTIFS='AKIA[0-9A-Z]{16}|aws_secret_access_key["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9/+=]{20,}|-----BEGIN (RSA|OPENSSH) PRIVATE KEY-----'
          if grep -rEn "$MOTIFS" \
               --include='*.ts' --include='*.js' --include='*.tsx' \
               --include='*.json' --include='*.yml' \
               --exclude-dir=node_modules --exclude-dir=.git \
               --exclude-dir=dist --exclude-dir=cdk.out --exclude-dir=.github . ; then
            echo "::error::Secret potentiel detecte dans le code source"
            exit 1
          fi
          echo "Aucun secret detecte"

  # ---- Revue avant fusion -----------------------------------------

  apercu:
    name: Apercu des changements
    needs: [qualite, tests, securite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dependances
        run: |
          cd pfe-rh-serverless && npm ci --omit=dev && cd ..
          cd infra && npm ci

      # Affiche ce que le deploiement modifierait, sans rien appliquer :
      # la revue de code etendue a l'infrastructure.
      - name: Differentiel d'infrastructure
        working-directory: infra
        run: npx cdk diff --all -c etape=${{ env.ETAPE }}

  # ---- Livraison --------------------------------------------------

  infra:
    name: Infrastructure
    needs: [qualite, tests, securite]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      url_api: ${{ steps.sorties.outputs.url_api }}
      compartiment: ${{ steps.sorties.outputs.compartiment }}
      distribution: ${{ steps.sorties.outputs.distribution }}
      url_application: ${{ steps.sorties.outputs.url_application }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --omit=dev : seules les dependances de production entrent dans le
      # paquet Lambda, plafonne a 250 Mo decompresses.
      - name: Dependances de production
        working-directory: pfe-rh-serverless
        run: npm ci --omit=dev

      - name: Dependances de l'infrastructure
        working-directory: infra
        run: npm ci

      - name: Deploiement
        working-directory: infra
        run: npx cdk deploy --all -c etape=${{ env.ETAPE }} --require-approval never

      # Les valeurs sont lues depuis CloudFormation plutot que codees
      # dans le depot : elles restent justes si une pile est recreee.
      - name: Lecture des sorties
        id: sorties
        run: |
          lire() {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text
          }
          echo "url_api=$(lire PfeRh-${{ env.ETAPE }}-Api UrlApi)" >> $GITHUB_OUTPUT
          echo "compartiment=$(lire PfeRh-${{ env.ETAPE }}-Front NomCompartimentFront)" >> $GITHUB_OUTPUT
          echo "distribution=$(lire PfeRh-${{ env.ETAPE }}-Front IdDistribution)" >> $GITHUB_OUTPUT
          echo "url_application=$(lire PfeRh-${{ env.ETAPE }}-Front UrlApplication)" >> $GITHUB_OUTPUT

  fumee:
    name: Test de fumee de l'API
    needs: infra
    runs-on: ubuntu-latest
    steps:
      # Une fonction qui ne demarre plus renvoie 500 sur toutes les
      # routes. Sans ce controle, l'echec ne se decouvre qu'a l'usage.
      - name: Route publique
        run: |
          URL="${{ needs.infra.outputs.url_api }}/offres"
          CODE=$(curl -s -o /tmp/reponse -w "%{http_code}" "$URL")
          echo "GET /offres -> $CODE"
          head -c 300 /tmp/reponse
          if [ "$CODE" != "200" ]; then
            echo "::error::L'API ne repond pas correctement ($CODE)"
            exit 1
          fi

      # Une route protegee doit etre rejetee par la passerelle avant
      # meme d'invoquer la fonction.
      - name: Route protegee sans jeton
        run: |
          URL="${{ needs.infra.outputs.url_api }}/employes"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "GET /employes sans jeton -> $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::L'autorisation ne protege pas la route ($CODE)"
            exit 1
          fi

  front:
    name: Application web
    needs: [infra, fumee]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dependances
        working-directory: frontend
        run: npm ci

      # L'URL de l'API vient du deploiement qui precede : le front
      # pointe toujours vers l'infrastructure reellement en place.
      - name: Configuration du build
        working-directory: frontend
        run: |
          cat > .env.production <<EOF
          VITE_API_URL=${{ needs.infra.outputs.url_api }}
          VITE_COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          VITE_AWS_REGION=${{ env.AWS_REGION }}
          EOF

      - name: Construction
        working-directory: frontend
        run: npm run build

      # Les fichiers portent une empreinte dans leur nom : leur contenu
      # ne change jamais, ils sont mis en cache un an.
      - name: Publication des ressources
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ needs.infra.outputs.compartiment }} \
            --delete --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      # index.html garde le meme nom d'une version a l'autre : jamais de
      # cache, sinon les navigateurs chargeraient l'ancienne application.
      - name: Publication de index.html
        working-directory: frontend
        run: |
          aws s3 cp dist/index.html s3://${{ needs.infra.outputs.compartiment }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Purge du cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.infra.outputs.distribution }} \
            --paths "/*"

  final:
    name: Verification finale
    needs: [infra, front]
    runs-on: ubuntu-latest
    steps:
      - name: Application servie
        run: |
          sleep 20
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ needs.infra.outputs.url_application }}")
          echo "GET application -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::CloudFront ne sert pas l'application ($CODE)"
            exit 1
          fi

      - name: Recapitulatif
        run: |
          {
            echo "## Deploiement reussi"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environnement | \`${{ env.ETAPE }}\` |"
            echo "| Region | \`${{ env.AWS_REGION }}\` |"
            echo "| API | ${{ needs.infra.outputs.url_api }} |"
            echo "| Application | ${{ needs.infra.outputs.url_application }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY