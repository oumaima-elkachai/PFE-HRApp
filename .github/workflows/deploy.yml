name: Déploiement

# Étapes du pipeline :
#
#   qualite    → typage et style, sur les trois dossiers
#   tests      → tests unitaires du moteur de paie
#   securite   → vulnérabilités des dépendances, fuites de secrets
#   apercu     → cdk diff, uniquement sur les pull requests
#   infra      → déploiement des cinq piles CDK
#   fumee      → l'API répond-elle réellement après déploiement
#   front      → construction et publication de l'application web
#   final      → l'application est-elle servie par CloudFront
#
# Les étapes s'enchaînent : un échec en amont empêche tout déploiement.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  ETAPE: dev
  NODE_VERSION: '22'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Intégration ──────────────────────────────────────────────────

  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Dépendances
        run: |
          cd pfe-rh-serverless && npm ci && cd ..
          cd frontend && npm ci && cd ..
          cd infra && npm ci

      # Attrape en deux secondes les erreurs d'import qui feraient
      # échouer toutes les routes après un déploiement de trois minutes.
      - name: Chargement de l'application
        working-directory: pfe-rh-serverless
        run: node -e "require('./server.js'); console.log('Chargement réussi')"

      - name: Typage du front
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Typage de l'infrastructure
        working-directory: infra
        run: npx tsc --noEmit

      # Le linting signale notamment les hooks React mal placés, une
      # erreur qui ne se manifeste autrement qu'à l'exécution.
      - name: Style du front
        working-directory: frontend
        run: npx eslint . --max-warnings 0
        continue-on-error: true

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pfe-rh-serverless/package-lock.json

      - name: Dépendances
        working-directory: pfe-rh-serverless
        run: npm ci

      # Le moteur de paie applique un barème légal : une régression y
      # produirait des bulletins faux sans lever la moindre erreur.
      - name: Moteur de paie
        working-directory: pfe-rh-serverless
        run: npx jest src/utils/__tests__ --verbose

      - name: Couverture
        working-directory: pfe-rh-serverless
        run: npx jest src/utils/__tests__ --coverage --coverageReporters=text-summary
        continue-on-error: true

  securite:
    name: Analyse de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Signale les dépendances portant une vulnérabilité connue.
      # En avertissement : une faille dans un outil de développement ne
      # doit pas bloquer une livraison, mais doit être visible.
      - name: Vulnérabilités du back
        working-directory: pfe-rh-serverless
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Vulnérabilités du front
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      # Recherche de secrets committés par inadvertance. Bloquant :
      # une clé publiée reste dans l'historique Git même après suppression.
      - name: Recherche de secrets
        run: |
          MOTIFS='AKIA[0-9A-Z]{16}|aws_secret_access_key|-----BEGIN (RSA|OPENSSH) PRIVATE KEY-----'
          if grep -rEn "$MOTIFS" --include='*.ts' --include='*.js' --include='*.tsx' \
               --include='*.json' --include='*.yml' \
               --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::Secret potentiel détecté dans le code source"
            exit 1
          fi
          echo "Aucun secret détecté"

  # ── Revue avant fusion ───────────────────────────────────────────

  apercu:
    name: Aperçu des changements
    needs: [qualite, tests, securite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dépendances
        run: |
          cd pfe-rh-serverless && npm ci --omit=dev && cd ..
          cd infra && npm ci

      # Affiche ce que le déploiement modifierait, sans rien appliquer :
      # la revue de code étendue à l'infrastructure.
      - name: Différentiel d'infrastructure
        working-directory: infra
        run: npx cdk diff --all -c etape=${{ env.ETAPE }}

  # ── Livraison ────────────────────────────────────────────────────

  infra:
    name: Infrastructure
    needs: [qualite, tests, securite]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      url_api: ${{ steps.sorties.outputs.url_api }}
      compartiment: ${{ steps.sorties.outputs.compartiment }}
      distribution: ${{ steps.sorties.outputs.distribution }}
      url_application: ${{ steps.sorties.outputs.url_application }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --omit=dev : seules les dépendances de production entrent dans le
      # paquet Lambda, plafonné à 250 Mo décompressés.
      - name: Dépendances de production
        working-directory: pfe-rh-serverless
        run: npm ci --omit=dev

      - name: Dépendances de l'infrastructure
        working-directory: infra
        run: npm ci

      - name: Déploiement
        working-directory: infra
        run: npx cdk deploy --all -c etape=${{ env.ETAPE }} --require-approval never

      # Les valeurs sont lues depuis CloudFormation plutôt que codées
      # dans le dépôt : elles restent justes si une pile est recréée.
      - name: Lecture des sorties
        id: sorties
        run: |
          lire() {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text
          }
          echo "url_api=$(lire PfeRh-${{ env.ETAPE }}-Api UrlApi)" >> $GITHUB_OUTPUT
          echo "compartiment=$(lire PfeRh-${{ env.ETAPE }}-Front NomCompartimentFront)" >> $GITHUB_OUTPUT
          echo "distribution=$(lire PfeRh-${{ env.ETAPE }}-Front IdDistribution)" >> $GITHUB_OUTPUT
          echo "url_application=$(lire PfeRh-${{ env.ETAPE }}-Front UrlApplication)" >> $GITHUB_OUTPUT

  fumee:
    name: Test de fumée de l'API
    needs: infra
    runs-on: ubuntu-latest
    steps:
      # Une fonction qui ne démarre plus renvoie 500 sur toutes les
      # routes. Sans ce contrôle, l'échec ne se découvre qu'à l'usage.
      - name: Route publique
        run: |
          URL="${{ needs.infra.outputs.url_api }}/offres"
          CODE=$(curl -s -o /tmp/reponse -w "%{http_code}" "$URL")
          echo "GET /offres → $CODE"
          cat /tmp/reponse | head -c 300
          if [ "$CODE" != "200" ]; then
            echo "::error::L'API ne répond pas correctement ($CODE)"
            exit 1
          fi

      # Une route protégée doit être rejetée par la passerelle avant
      # même d'invoquer la fonction.
      - name: Route protégée sans jeton
        run: |
          URL="${{ needs.infra.outputs.url_api }}/employes"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "GET /employes sans jeton → $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::L'autorisation ne protège pas la route ($CODE)"
            exit 1
          fi

  front:
    name: Application web
    needs: [infra, fumee]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dépendances
        working-directory: frontend
        run: npm ci

      # L'URL de l'API vient du déploiement qui précède : le front
      # pointe toujours vers l'infrastructure réellement en place.
      - name: Configuration du build
        working-directory: frontend
        run: |
          cat > .env.production <<EOF
          VITE_API_URL=${{ needs.infra.outputs.url_api }}
          VITE_COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          VITE_AWS_REGION=${{ env.AWS_REGION }}
          EOF

      - name: Construction
        working-directory: frontend
        run: npm run build

      # Les fichiers portent une empreinte dans leur nom : leur contenu
      # ne change jamais, ils sont mis en cache un an.
      - name: Publication des ressources
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ needs.infra.outputs.compartiment }} \
            --delete --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      # index.html garde le même nom d'une version à l'autre : jamais de
      # cache, sinon les navigateurs chargeraient l'ancienne application.
      - name: Publication de index.html
        working-directory: frontend
        run: |
          aws s3 cp dist/index.html s3://${{ needs.infra.outputs.compartiment }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Purge du cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.infra.outputs.distribution }} \
            --paths "/*"

  final:
    name: Vérification finale
    needs: [infra, front]
    runs-on: ubuntu-latest
    steps:
      - name: Application servie
        run: |
          sleep 20
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ needs.infra.outputs.url_application }}")
          echo "GET application → $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::CloudFront ne sert pas l'application ($CODE)"
            exit 1
          fi

      - name: Récapitulatif
        run: |
          {
            echo "## Déploiement réussi"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environnement | \`${{ env.ETAPE }}\` |"
            echo "| Région | \`${{ env.AWS_REGION }}\` |"
            echo "| API | ${{ needs.infra.outputs.url_api }} |"
            echo "| Application | ${{ needs.infra.outputs.url_application }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY