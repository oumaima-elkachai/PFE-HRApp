# sonar-project.properties
#
# Configuration de l'analyse SonarCloud. Ce fichier va à la racine du
# dépôt, à côté de .github/.
#
# Les valeurs projectKey et organization sont fournies par SonarCloud
# lors de la création du projet — remplacer si elles diffèrent.

sonar.projectKey=oumaima-elkachai_PFE-HRApp
sonar.organization=oumaima-elkachai
sonar.projectName=TERRA HR
sonar.projectVersion=1.0

# ── Périmètre analysé ────────────────────────────────────────────
# Le code applicatif des trois dossiers : back, front et infrastructure.
# L'infrastructure est incluse volontairement : une erreur dans une
# stack CDK a autant de conséquences qu'une erreur applicative.

sonar.sources=pfe-rh-serverless/src,pfe-rh-serverless/server.js,pfe-rh-serverless/lambda.js,frontend/src,infra/lib,infra/bin

# ── Exclusions ───────────────────────────────────────────────────
# Dépendances, artefacts de construction et sorties de synthèse : ni
# écrits ni maintenus par le projet.

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/cdk.out/**,\
  **/coverage/**,\
  **/*.min.js,\
  pfe-rh-serverless/scripts/**

# ── Tests et couverture ──────────────────────────────────────────

sonar.tests=pfe-rh-serverless/src/utils/__tests__
sonar.test.inclusions=**/*.test.js,**/*.spec.js

sonar.javascript.lcov.reportPaths=pfe-rh-serverless/coverage/lcov.info

# La couverture n'a de sens que sur le code métier : exclure les
# fichiers de configuration et les points d'entrée évite un indicateur
# artificiellement bas.
sonar.coverage.exclusions=\
  infra/**,\
  frontend/src/**,\
  pfe-rh-serverless/server.js,\
  pfe-rh-serverless/lambda.js,\
  **/__tests__/**

# ── Encodage ─────────────────────────────────────────────────────
# UTF-8 explicite : plusieurs fichiers du projet ont souffert d'une
# lecture en Latin-1, qui corrompt les accents et fausse l'analyse.

sonar.sourceEncoding=UTF-8